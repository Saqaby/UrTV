<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>الشاشة الرئيسية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500&family=Readex+Pro:wght@500&display=swap">
<style>
/* نسخة HTML من الشاشة الرئيسية (android/launcher/.../MainActivity.java). المقاسات من الكود: dp × 2 على شاشة 1920×1080.
   غيّر القيم هنا لتجرّب التعديلات، ثم نترجمها إلى الكود الأصلي. */
:root{
  --gold:#D6AF6B;          /* GOLD في MainActivity */
  --sand:#FFFDF6;          /* لون الساعة */
  --muted:#C6BBA4;         /* التاريخ وسطر الطقس */
  --pill-bg:rgba(0,0,0,.40);
  --pill-line:rgba(255,255,255,.20);
  --band-bg:rgba(255,255,255,.12);
  --band-line:rgba(255,255,255,.08);
  --f-body:"Thmanyah","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-display:"Thmanyah Display","Readex Pro","IBM Plex Sans Arabic",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000;color:#fff;font-family:var(--f-body)}
.wall{position:absolute;inset:0;background:url("assets/backgrounds/LAj90eAXOZA.jpg") center/cover}
/* الـ scrim: أغمق فوق (الساعة والأزرار) وتحت (الشريط) */
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.70),rgba(0,0,0,.25) 25%,rgba(0,0,0,.15) 50%,rgba(0,0,0,.55) 75%,rgba(0,0,0,.90))}
.hero{position:absolute;inset:0}

/* أعلى اليمين: التحية، الساعة، التاريخ */
.clock-block{position:absolute;top:72px;right:96px;text-align:right;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.greeting{color:var(--gold);font-size:30px;font-weight:500;margin-right:8px}
.weather{color:var(--muted);font-size:24px;margin:2px 8px 0 0;display:flex;align-items:center;justify-content:flex-end;gap:10px;direction:rtl}
/* تعديل: أيقونة الطقس (نفس رسوم شاشة التوقف: wxIcon) */
.wxi{width:34px;height:34px;fill:none;stroke:#E0BA74;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;order:-1}
.clock-row{display:flex;align-items:flex-start;gap:12px;margin-top:-4px}
.clock{font-family:var(--f-display);font-size:116px;line-height:1;color:var(--sand);font-weight:500}
.ampm{color:var(--gold);font-size:32px;font-weight:500;margin-top:12px;order:2}
.date{color:var(--muted);font-size:28px;margin:-6px 8px 0 0}
/* تعديل: المتبقي على رمضان تحت التاريخ (بحساب أم القرى مثل شاشة التوقف) */
/* تعديل: الهجري (أم القرى) هو التاريخ الأساسي، والميلادي سطر أصغر تحته */
.greg{color:var(--muted);font-size:22px;opacity:.8;margin:2px 8px 0 0}
.chips{display:flex;flex-direction:column;align-items:flex-end;gap:12px;margin:16px 8px 0 0}
.chip{display:inline-flex;align-items:baseline;gap:10px;padding:8px 22px;border-radius:30px;
  background:rgba(0,0,0,.35);border:2px solid rgba(214,175,107,.45);color:var(--sand);font-size:26px}
.chip b{color:var(--gold);font-size:34px;font-weight:500}
.chip small{color:var(--muted);font-size:24px}

/* أعلى اليسار: الأزرار (Pill: ارتفاع 34dp، أيقونة 18dp) */
.pills{position:absolute;top:72px;left:96px;display:flex;flex-direction:row;gap:20px}
.pill{height:68px;display:flex;align-items:center;gap:18px;padding:0 16px;border-radius:34px;background:var(--pill-bg);border:2px solid var(--pill-line);
  color:rgba(255,255,255,.9);font-size:26px;font-weight:500;white-space:nowrap;transition:background .2s,color .2s}
.pill svg{width:36px;height:36px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pill span{display:none}   /* مغلق: أيقونة فقط (Pill.java) */
.pill.focus{background:rgba(255,255,255,.95);color:#111;padding:0 32px}
.pill.focus span{display:inline}

/* البطاقة الاختيارية تحت الأزرار (HomeCard: 461×250 dp) */
.card{position:absolute;top:168px;left:96px;width:922px;max-height:500px;border-radius:24px;background:rgba(4,14,9,.46);border:2px solid rgba(214,175,107,.35);
  backdrop-filter:blur(14px);padding:30px 44px;display:flex;flex-direction:column;gap:4px}
.card[hidden]{display:none}
.card h3{margin:0;color:var(--gold);font-size:26px;font-weight:500;display:flex;align-items:center;gap:20px}
.card h3::after{content:"";flex:1;height:2px;background:linear-gradient(to left,rgba(214,175,107,.5),transparent)}
.row{display:flex;justify-content:space-between;align-items:baseline;font-size:30px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.row .name{color:#fff}.row .t{color:var(--muted);font-size:28px}
/* تعديل: المتبقي على الصلاة القادمة بجانب وقتها */
.row .left{color:var(--gold);font-size:26px;margin-inline-start:auto;margin-inline-end:28px;opacity:.85}
/* قائمة الإعدادات (مثل قوائم التطبيق المنبثقة: خلفية 0xF02A2A2E، زاوية 16dp، صف 36dp) */
.menu{position:absolute;top:156px;width:460px;padding:16px;border-radius:32px;background:rgba(42,42,46,.94);border:2px solid rgba(255,255,255,.15);box-shadow:0 32px 64px rgba(0,0,0,.5)}
.menu[hidden]{display:none}
.menu div{height:72px;display:flex;align-items:center;padding:0 28px;border-radius:20px;font-size:28px;color:#fff;cursor:pointer}
.menu div.focus{background:rgba(255,255,255,.95);color:#111}
.menu hr{border:0;border-top:1px solid rgba(255,255,255,.12);margin:8px 12px}
.toast{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);padding:18px 36px;border-radius:40px;background:rgba(20,20,20,.92);font-size:26px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.row.next .name,.row.next .t{color:var(--gold)}
.row.past{opacity:.45}

/* أسفل: اسم التطبيق المحدد + شريط المفضّلات */
/* تعديل: الشريط بقدر محتواه، والبلاطات أكبر كلما قلّ عدد التطبيقات */
.bottom{position:absolute;left:96px;right:96px;bottom:60px;display:flex;flex-direction:column;align-items:center}
.title{font-size:68px;font-weight:300;margin:0 0 28px;text-shadow:0 0 36px rgba(0,0,0,.4);text-align:center}
.band{max-width:100%;display:flex;flex-direction:row;justify-content:center;gap:44px;padding:44px 56px;border-radius:52px;background:var(--band-bg);border:2px solid var(--band-line)}
.tile{flex:0 1 var(--tile-w,200px);width:var(--tile-w,200px);min-width:0;aspect-ratio:16/9;overflow:hidden;text-align:center;padding:0 8px;border-radius:20px;display:grid;place-items:center;font-size:30px;font-weight:500;color:#fff;
  transition:transform .2s,box-shadow .2s;position:relative;direction:ltr}
.tile.focus{transform:scale(1.12);box-shadow:0 0 0 4px rgba(255,255,255,.9),0 28px 50px rgba(0,0,0,.5)}
.hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:18px;color:rgba(255,255,255,.4)}
</style>
</head>
<body>
<div class="wall"></div>
<div class="scrim"></div>
<div class="hero">
  <div class="clock-block">
    <div class="greeting" id="greeting">مساء الخير</div>
    <div class="weather"><svg class="wxi" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M18.7 5.3L17 7M7 17l-1.7 1.7"/></svg>٣١° صافي · الغروب ٥:٣١ م</div>
    <div class="clock-row"><div class="clock" id="clock">٩:٤٢</div><div class="ampm" id="ampm">م</div></div>
    <div class="date" id="date"></div>
    <div class="greg" id="greg"></div>
    <div class="chips">
      <div class="chip" id="ramadan"></div>
    </div>
  </div>

  <div class="pills" id="pills"></div>

  <section class="card" id="card">
    <h3>مواقيت الصلاة اليوم</h3>
    <div id="prayer-rows"></div>
  </section>

  <div class="bottom">
    <div class="title" id="title">MovieBoxPro</div>
    <div class="band" id="band"></div>
  </div>
</div>
<div class="menu" id="menu" hidden></div>
<div class="toast" id="toast"></div>
<div class="hint">الأسهم للتنقل · Enter للاختيار · Esc للرجوع</div>

<script src="apps.js"></script>
<script>
// الأزرار بترتيبها في الكود (يُقرأ من اليمين)
const ICONS = {
  input:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 12h8M14 8l4 4-4 4"/>',
  wifi:'<path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  sleep:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4"/>',
  saver:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',
  listen:'<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-6h3zM3 19a2 2 0 0 0 2 2h1v-6H3z"/>'
};
// تعديل: خمسة أزرار؛ الخامس «إذاعة القرآن» يشغّل الإذاعة ومعها شاشة التوقف؛ المهام وشاشة التوقف انتقلتا إلى قائمة الإعدادات، و«تلاوة وأذان» حُذف
const PILLS = [['المصادر','input'],['واي فاي','wifi'],['الإعدادات','settings'],['مؤقت النوم','sleep'],['إذاعة القرآن','listen']];
// المفضّلات: من «ترتيب المفضلة» (apps.js)، بأسماء وألوان تقريبية بدل الشعارات
let APPS = loadDock().map(k => ALL_APPS[k]);

const pillsEl = document.getElementById('pills'), band = document.getElementById('band');
PILLS.forEach(([n,i]) => pillsEl.insertAdjacentHTML('beforeend', `<div class="pill"><svg viewBox="0 0 24 24">${ICONS[i]}</svg><span>${n}</span></div>`));
function drawDock(){
  band.innerHTML = '';
  APPS.forEach(([n,c]) => band.insertAdjacentHTML('beforeend', `<div class="tile" style="background:${c}">${n}</div>`));
  rows[1] = [...band.children];
  band.style.setProperty('--tile-w', (APPS.length <= 3 ? 320 : APPS.length <= 5 ? 260 : 200) + 'px');
}

// تنقّل بالريموت: صف الأزرار فوق، صف التطبيقات تحت
const rows = [[...pillsEl.children], []];
drawDock();
let r = 1, c = 0;
function paint(){
  rows.flat().forEach(e => e.classList.remove('focus'));
  rows[r][c].classList.add('focus');
  if (r === 1) document.getElementById('title').textContent = APPS[c][0];
}
addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') { r = 0; c = Math.min(c, rows[0].length - 1); }
  else if (e.key === 'ArrowDown') { r = 1; c = Math.min(c, rows[1].length - 1); }
  else if (e.key === 'ArrowLeft') c = Math.min(c + 1, rows[r].length - 1);   // RTL: اليسار = التالي
  else if (e.key === 'ArrowRight') c = Math.max(c - 1, 0);
  else if (e.key === 'Enter') { if (r === 0 && PILLS[c][1] === 'settings') openMenu(); else if (r === 0 && PILLS[c][1] === 'listen') quranRadio(); else toast(r === 0 ? PILLS[c][0] : 'فتح ' + APPS[c][0]); }
  else return;
  e.preventDefault(); paint();
});

// تعديل: زر «الإعدادات» صار قائمة صغيرة؛ «إعدادات التلفاز» في آخرها تفتح إعدادات النظام كما كان
const MENU = [
  ['الأذان', () => location.href = 'adhan.html'],
  ['ترتيب المفضلة', () => location.href = 'dock.html'],
  ['المهام', () => toast('تفتح قائمة المهام')],
  ['شاشة التوقف', () => { try { parent.postMessage({go: 'saver.html'}, '*'); } catch (e) {} }],
  null,
  ['إعدادات التلفاز', () => toast('تفتح إعدادات نظام التلفاز')],
];
let menuAt = 0;
function toast(t){ const e = document.getElementById('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('show'), 2000); }
function openMenu(){
  const m = document.getElementById('menu'), pill = rows[0][c].getBoundingClientRect();
  m.innerHTML = MENU.map((x, i) => x ? `<div data-i="${i}">${x[0]}</div>` : '<hr>').join('');
  m.style.left = pill.left + 'px'; m.hidden = false; menuAt = 0; paintMenu();
  m.querySelectorAll('div').forEach(d => d.onclick = () => { m.hidden = true; MENU[+d.dataset.i][1](); });
}
function paintMenu(){ const items = [...document.querySelectorAll('#menu div')]; items.forEach((d, i) => d.classList.toggle('focus', i === menuAt)); }
addEventListener('keydown', e => {
  const m = document.getElementById('menu');
  if (m.hidden) return;
  const items = [...m.querySelectorAll('div')];
  if (e.key === 'ArrowDown') menuAt = Math.min(items.length - 1, menuAt + 1);
  else if (e.key === 'ArrowUp') menuAt = Math.max(0, menuAt - 1);
  else if (e.key === 'Enter') { m.hidden = true; MENU[+items[menuAt].dataset.i][1](); }
  else if (e.key === 'Escape' || e.key === 'Backspace') m.hidden = true;
  e.stopImmediatePropagation(); e.preventDefault(); paintMenu();
}, true);
rows[0].forEach((el, i) => el.onclick = () => { r = 0; c = i; paint(); if (PILLS[i][1] === 'settings') openMenu(); else if (PILLS[i][1] === 'listen') quranRadio(); });
// «إذاعة القرآن»: تشغيل إذاعة القرآن الكريم (السعودية) ثم شاشة التوقف فوقها؛ والضغط مرة ثانية يوقفها
let radioOn = false;
function quranRadio(){
  radioOn = !radioOn;
  const pill = rows[0][PILLS.findIndex(x => x[1] === 'listen')];
  pill.querySelector('span').textContent = radioOn ? 'إيقاف الإذاعة' : 'إذاعة القرآن';
  pill.style.color = radioOn && !pill.classList.contains('focus') ? 'var(--gold)' : '';
  if (!radioOn) return toast('توقفت الإذاعة');
  toast('تعمل إذاعة القرآن الكريم، وتُفتح شاشة التوقف');
  setTimeout(() => { try { parent.postMessage({go: 'saver.html'}, '*'); } catch (e) {} }, 1500);
}
addEventListener('message', e => {
  if (e.data && e.data.card != null) document.getElementById('card').hidden = !e.data.card;
  if (e.data && Array.isArray(e.data.dock)) { APPS = e.data.dock.map(k => ALL_APPS[k]).filter(Boolean); drawDock(); c = Math.min(c, APPS.length - 1); paint(); }
});
paint();

// الساعة والتاريخ الحقيقيان بتوقيت الرياض
function tick(){
  const d = new Date(), tz = 'Asia/Riyadh';
  const t = new Intl.DateTimeFormat('ar-SA-u-nu-arab', {hour:'numeric', minute:'2-digit', hour12:true, timeZone:tz}).formatToParts(d);
  document.getElementById('clock').textContent = t.filter(p => p.type==='hour'||p.type==='minute'||p.type==='literal' && p.value.trim()===':').map(p=>p.value).join('');
  const h = +new Intl.DateTimeFormat('en', {hour:'numeric', hour12:false, timeZone:tz}).format(d);
  document.getElementById('ampm').textContent = h < 12 ? 'ص' : 'م';
  document.getElementById('greeting').textContent = h < 12 ? 'صباح الخير' : 'مساء الخير';
  const hij = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-arab', {weekday:'long', day:'numeric', month:'long', year:'numeric', timeZone:tz}).format(d);
  const greg = new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-arab', {day:'numeric', month:'long', timeZone:tz}).format(d);
  document.getElementById('date').textContent = hij;
  document.getElementById('greg').textContent = new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-arab', {day:'numeric', month:'long', year:'numeric', timeZone:tz}).format(d) + 'م';
}
// أيام حتى ١ رمضان بتقويم أم القرى؛ في رمضان: رقم اليوم منه
function ramadan(){
  const fmt = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura', {timeZone:'Asia/Riyadh', month:'numeric', day:'numeric'});
  const h = d => { const o = {}; fmt.formatToParts(d).forEach(x => { if (x.type === 'month' || x.type === 'day') o[x.type] = +x.value.replace(/\D/g, ''); }); return o; };
  const now = Date.now(), t = h(new Date(now)), el = document.getElementById('ramadan');
  const n = x => new Intl.NumberFormat('ar-SA-u-nu-arab').format(x);
  if (t.month === 9) { el.innerHTML = `رمضان مبارك · اليوم <b>${n(t.day)}</b>`; return; }
  for (let i = 1; i < 400; i++) { const d = h(new Date(now + i * 864e5)); if (d.month === 9 && d.day === 1) { el.innerHTML = `باقٍ على رمضان <b>${n(i)}</b> يومًا`; return; } }
}
// مواقيت تجريبية للرياض (على التلفاز: حساب أم القرى من التطبيق نفسه)
const PRAYERS = [['الفجر', '04:48'], ['الظهر', '11:38'], ['العصر', '14:52'], ['المغرب', '17:31'], ['العشاء', '19:01']];
const num = x => new Intl.NumberFormat('ar-SA-u-nu-arab').format(x);
const t12 = hm => { let [h, m] = hm.split(':').map(Number); const a = h < 12 ? 'ص' : 'م'; h = h % 12 || 12; return num(h) + ':' + num(m).padStart(2, '٠') + ' ' + a; };
// يُبرز الصلاة القادمة في بطاقة المواقيت
function nextPrayer(){
  const p = new Intl.DateTimeFormat('en', {hour:'numeric', minute:'numeric', hour12:false, timeZone:'Asia/Riyadh'}).formatToParts(new Date());
  const now = +p.find(x => x.type === 'hour').value % 24 * 60 + +p.find(x => x.type === 'minute').value;
  const mins = PRAYERS.map(([, hm]) => { const [h, m] = hm.split(':').map(Number); return h * 60 + m; });
  let i = mins.findIndex(m => m > now), left;
  if (i < 0) { i = 0; left = mins[0] + 1440 - now; } else left = mins[i] - now;
  // «- ١٩ دقيقة»؛ ساعة فأكثر: «- ٣ س ١٨ د»
  const rest = left < 60 ? `- ${num(left)} دقيقة` : `- ${num(Math.floor(left / 60))} س ${num(left % 60)} د`;
  document.getElementById('prayer-rows').innerHTML = PRAYERS.map(([n, hm], k) =>
    `<div class="row${k === i ? ' next' : mins[k] <= now ? ' past' : ''}"><span class="name">${n}</span>${k === i ? `<span class="left">${rest}</span>` : ''}<span class="t">${t12(hm)}</span></div>`).join('');
}
function tickAll(){ tick(); ramadan(); nextPrayer(); }
tickAll(); setInterval(tickAll, 15000);
</script>
</body>
</html>
